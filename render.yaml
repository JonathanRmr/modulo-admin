services:
  - type: web
    name: barbertime-admin
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 7d
      - key: USUARIOS_URL
        value: https://usuarios-75yj.onrender.com
      - key: SERVICIOS_URL
        value: https://servicios-main.onrender.com
      - key: CITAS_URL
        value: https://citas-mvyw.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false